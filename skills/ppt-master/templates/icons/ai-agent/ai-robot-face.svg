<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Antenna with neon blue bulb -->
  <path d="M12 6V3" stroke="#0052FF" stroke-width="2" stroke-linecap="round" />
  <circle cx="12" cy="2.5" r="1.5" fill="#00D2FF" />
  <!-- Ears -->
  <path d="M4 11v3a1 1 0 0 0 1 1" stroke="#90CDF4" stroke-width="1.5" />
  <path d="M20 11v3a1 1 0 0 1-1 1" stroke="#90CDF4" stroke-width="1.5" />
  <!-- Robot Face Outline - Solid tech blue stroke, white background fill -->
  <rect x="5" y="6" width="14" height="12" rx="3" fill="#FFFFFF" stroke="#0052FF" stroke-width="2" />
  <!-- Eyes - glowing neon blue -->
  <circle cx="9" cy="11" r="1.5" fill="#00D2FF" />
  <circle cx="15" cy="11" r="1.5" fill="#00D2FF" />
  <!-- Mouth (Friendly curve) -->
  <path d="M9 15h6" stroke="#0052FF" stroke-width="2" stroke-linecap="round" />
  <!-- Side screws -->
  <circle cx="4" cy="12" r="1" fill="#90CDF4" />
  <circle cx="20" cy="12" r="1" fill="#90CDF4" />
</svg>
